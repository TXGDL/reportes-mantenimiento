<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9d2449">
<title>Reportes de mantenimiento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:#f5f5f5;color:#222}
  header{background:#9d2449;color:#fff;padding:16px}
  header h1{margin:0;font-size:1.2rem} header p{margin:4px 0 0;font-size:.85rem;opacity:.9}
  main{max-width:520px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  button{width:100%;font-size:1.05rem;padding:14px;border:0;border-radius:10px;background:#9d2449;color:#fff;margin-top:12px}
  button:disabled{opacity:.5}
  #estado{margin-top:12px;font-size:.95rem;min-height:1.4em}
</style>
</head>
<body>
<header><h1>Reportes de mantenimiento</h1><p>Versión de prueba 0.1</p></header>
<main>
  <div class="card">
    <p>Esta versión solo comprueba que el celular puede armar un reporte completo a partir de la plantilla. Usa datos y fotos ficticios.</p>
    <button id="btnGenerar">Generar reporte de prueba</button>
    <div id="estado"></div>
    <button id="btnDescargar" hidden>Descargar reporte</button>
  </div>
</main>
<script src="lib/pizzip.min.js"></script>
<script src="lib/docxtemplater.min.js"></script>
<script src="lib/imagemodule.js"></script>
<script src="motor.js"></script>
<script src="datos-prueba.js"></script>
<script src="app.js"></script>
</body>
</html>
